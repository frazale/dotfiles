theme = "sonokai"

[editor]
cursorline = true
color-modes = true
true-color = true
undercurl = true
bufferline = "multiple"
text-width = 80
auto-completion = true
path-completion = true
completion-trigger-len = 1
completion-timeout = 5
preview-completion-insert = true
completion-replace = true
auto-format = true
auto-info = true
idle-timeout = 250
mouse = true
auto-pairs = true
middle-click-paste = true
insert-final-newline = true
trim-final-newlines = true
trim-trailing-whitespace = true
popup-border = "none" #popup | menu | all | none
jump-label-alphabet = "abcdefghijklmnopqrstuvwxyz"
end-of-line-diagnostics = "hint" #error, warning, info, hint

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.lsp]
enable = true
display-messages = true
display-progress-messages = true
auto-signature-help = true
display-inlay-hints = true
display-color-swatches = true
display-signature-help-docs = true
snippets = true
goto-reference-include-declaration = true

[editor.file-picker]
hidden = false
follow-symlinks = true
deduplicate-links = true
parents = true
ignore = true
git-ignore = true
git-global = true
git-exclude = true
max-depth = 8

[editor.auto-save]
focus-lost = true
after-delay.enable = true
after-delay.timeout = 5000

[editor.indent-guides]
render = true
character = "│"

[editor.whitespace.render]
space = "none"
tab = "all"
newline = "none"

[editor.whitespace.character]
tab = "→"

[editor.soft-wrap]
enable = true
max-wrap = 20
max-indent-retain = 40
wrap-indicator = "↪ "
wrap-at-text-width = true

[editor.smart-tab]
enable = true
supersede-menu = false

[editor.inline-diagnostics]
cursor-line = "hint"
other-lines = "disable"
prefix-len = 1
max-wrap = 20
max-diagnostics = 10

[editor.search]
smart-case = true
wrap-around = true

[editor.gutters]
layout = ["diff", "diagnostics", "line-numbers", "spacer"]

[editor.gutters.line-numbers]
min-width = 4

[editor.statusline]
left = ["mode", "spinner", "file-absolute-path", "file-modification-indicator"]
center = ["read-only-indicator"]
right = ["diagnostics", "selections", "position", "total-line-numbers", "file-encoding", "version-control"]
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[keys.normal]
L = ":bn"
H = ":bp"
K = "hover"

[keys.normal.space]
x = ":bc"

[keys.normal.space.A]
r = ":sh just run"

[keys.insert]
C-space = "completion"
A-h = "move_char_left"
A-j = "move_line_down"
A-k = "move_line_up"
A-l = "move_char_right"
